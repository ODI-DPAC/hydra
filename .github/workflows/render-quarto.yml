name: Render and publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Typst
        env:
          TYPST_VERSION: "0.14.2"
        run: |
          # Quarto shells out to a `typst` binary on PATH for the typst
          # format; it does not bundle one itself, so it has to be
          # installed separately. Pinned to the version this project's
          # --no-pdf-tags workaround (below) was verified against.
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf typst.tar.xz
          sudo mv "typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          rm -rf typst.tar.xz typst-x86_64-unknown-linux-musl
          typst --version

      - name: Render consolidated PDF (Typst)
        run: |
          # Quarto's own compile attempt below is expected to fail (see the
          # workaround note); `|| true` keeps the step alive so the manual
          # `typst compile` after it can still run.
          quarto render --profile pdf --to typst || true
          # Workaround for a Typst tagged-PDF (accessibility) writer bug that
          # crashes on this project (reproduced on Typst 0.14.2 and 0.15.0,
          # tracked upstream; quarto does not expose --no-pdf-tags itself).
          test -f index.typ
          typst compile --no-pdf-tags index.typ assets/documentation.pdf
          rm -f index.typ

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
