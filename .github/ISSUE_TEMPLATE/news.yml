name: News item (Hydra admin team)
description: Hydra admin team only. Announce something on the docs site; a pull request adds it to News and, if you ask, to the banner on every page.
title: "News: "
labels: ["news"]
body:
  - type: input
    id: date
    attributes:
      label: Date
      description: The date of the event or the notice, as YYYY-MM-DD.
      placeholder: "2026-10-07"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text
      description: One to three sentences. No Markdown needed. The first sentence is what shows on the home page card and in the banner.
      placeholder: "Hydra is unavailable on Tuesday October 7 from 8 am to noon ET for maintenance. Running jobs will be terminated when maintenance begins. Please prepare accordingly."
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Page with the details (optional)
      description: A page on the site, as a path such as jobs/queues.md, or a full URL.
      placeholder: "jobs/queues.md"
  - type: dropdown
    id: post
    attributes:
      label: Post this on the News page?
      description: "No" makes it banner only, for a notice that does not need a permanent line, or for putting a banner back that was already posted.
      options:
        - "Yes"
        - "No"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: banner
    attributes:
      label: Show a banner at the top of every page?
      options:
        - "No"
        - "Yes: maintenance (planned downtime)"
        - "Yes: outage (unplanned downtime)"
        - "Yes: information (cluster is fine)"
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Downtime starts (maintenance only)
      description: Eastern time, as YYYY-MM-DD HH:MM. The status pill says Operational until this moment. Leave blank for an outage (it starts now) and for information.
      placeholder: "2026-10-07 08:00"
  - type: input
    id: until
    attributes:
      label: Banner comes down (optional)
      description: Eastern time, as YYYY-MM-DD HH:MM, or a date. For maintenance, the end of the window. Leave blank to take the banner down yourself with the "Take down the banner" form.
      placeholder: "2026-10-07 12:00"
