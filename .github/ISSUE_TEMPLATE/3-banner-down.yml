name: Admin team - Remove banner
description: Hydra admin team only. Take the banner down.
title: "Banner down"
labels: ["banner-down"]
body:
  - type: input
    id: note
    attributes:
      label: Closing line (optional)
      description: Added to the end of the News entry the banner was for, for example "Resolved at 3 pm." If the banner had no entry, this becomes an entry dated today.
      placeholder: "Hydra is back in service as of 3 pm."
