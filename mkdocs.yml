# Hydra documentation. Build: zensical serve   Deploy: push to main (see .github/workflows/deploy.yml)
site_name: Smithsonian HPC
site_description: User documentation for Hydra, the Smithsonian Institution High Performance Computing cluster
site_url: https://smithsonian.github.io/hydra/
repo_url: https://github.com/Smithsonian/hydra
repo_name: Smithsonian/hydra
edit_uri: edit/main/docs/
copyright: 'Smithsonian Institution, Office of Digital and Innovation &middot; <a href="mailto:SI-HPC@si.edu">SI-HPC@si.edu</a>'

theme:
  name: material
  variant: modern
  custom_dir: overrides
  language: en
  favicon: assets/favicon.png
  icon:
    logo: material/server-network
    admonition:
      note: octicons/info-16
      info: octicons/info-16
      warning: octicons/alert-16
      danger: octicons/stop-16
      tip: octicons/light-bulb-16
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra:
  # Announcement bar and status pill. kind: maintenance | outage | info.
  # Blank text = no banner, pill shows Operational.
  announce:
    kind: info
    text: ""
    link: news/
  status_url: https://hydra.si.edu/tools/status/
  support_email: SI-HPC@si.edu
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Smithsonian/hydra

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Nav is independent of the directory tree. The site is served under /hydra/, so
# the docs tree is flat: docs/jobs, docs/storage, docs/software, docs/interactive.
# Keep sidebar labels short; the page H1 carries the full title.
nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Requesting an account: getting-started/account.md
      - Logging in and passwords: getting-started/login.md
      - Quick start: getting-started/quick-start.md
      - Training and workshops: getting-started/training.md
  - Running Jobs:
      - jobs/index.md
      - How the scheduler works: jobs/concepts.md
      - Write and submit a job: jobs/submit.md
      - Request a queue, memory and CPUs: jobs/request-resources.md
      - Submit a job array: jobs/arrays.md
      - Submit a parallel job: jobs/parallel.md
      - Monitor and manage jobs: jobs/monitoring.md
      - QSub Generator: jobs/qsubgen.md
      - Queues: jobs/queues.md
      - Job script reference: jobs/job-scripts.md
      - Resource limits: jobs/limits.md
      - Monitoring tools: jobs/tools.md
      - Warning emails: jobs/efficiency.md
      - Examples: jobs/examples.md
      - Cluster hardware: jobs/hardware.md
  - Interactive Use:
      - interactive/index.md
      - qrsh sessions: interactive/qrsh.md
      - Jupyter: interactive/jupyter.md
      - VS Code: interactive/vscode.md
      - RStudio: interactive/rstudio.md
  - Storage:
      - storage/index.md
      - Check usage and quotas: storage/quotas.md
      - Recover a file from a snapshot: storage/snapshots.md
      - Scrubbed files and restores: storage/scrubber.md
      - Use a node's local SSD: storage/ssd.md
      - Use /store and the I/O queue: storage/store.md
      - Filesystems: storage/filesystems.md
      - Backups: storage/backups.md
  - Software:
      - software/index.md
      - Find and load software: software/modules.md
      - Python and conda: software/python.md
      - R: software/r.md
      - Julia, MATLAB, IDL, Java: software/other-languages.md
      - GPUs: software/gpus.md
      - Containers: software/containers.md
      - Write a module file: software/custom-modules.md
      - Compilers, libraries and MPI: software/compilers.md
      - Installed modules: software/module-list.md
      - Guides:
          - software/guides/index.md
          - BEAST: software/guides/beast.md
          - BirdNET: software/guides/birdnet.md
          - BLAST: software/guides/blast.md
          - Blast2GO: software/guides/blast2go.md
          - BUSCO: software/guides/busco.md
          - MaSuRCA: software/guides/masurca.md
          - SMC++: software/guides/smc.md
          - SPAdes: software/guides/spades.md
          - Local databases: software/guides/databases.md
  - Data Transfer:
      - data-transfer/index.md
      - scp, sftp and rsync: data-transfer/scp-rsync.md
      - Globus: data-transfer/globus.md
      - rclone and cloud storage: data-transfer/rclone.md
  - Policies & Support:
      - policies/index.md
      - Usage policies: policies/usage.md
      - Citing Hydra: policies/citing.md
      - Getting help: policies/help.md
      - FAQ: policies/faq.md
      - Cluster status: policies/status.md
  - News:
      - news/index.md
      - Older notices: news/history.md
      - Cluster upgrades:
          - news/upgrades/index.md
          - 2025 data center move: news/upgrades/2025-data-center-move.md
          - 2024 upgrade to Hydra-7: news/upgrades/2024-hydra-7.md
          - 2021 upgrade to Hydra-6: news/upgrades/2021-hydra-6.md
          - 2019 upgrade to Hydra-5: news/upgrades/2019-hydra-5.md